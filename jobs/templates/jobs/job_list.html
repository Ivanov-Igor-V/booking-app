<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Atlas</title>
</head>
<body>
    <h1>Developer vacancies</h1>
    <form method="get">
        <label for="job-search">Search by title or company</label>
        <input id="job-search" type="search" name="q" value="{{ keyword }}">
        <button type="submit">Search</button>
    </form>

    <ul>
        {% for job in jobs %}
            <li>
                <p>{{ job.title }} — {{ job.company_name }} {{ job.publication_date|date:"d.m.Y H:i" }}</p>
                <p><a href="{{ job.original_url }}">link</a></p>
            </li>
        {% empty %}
            <li>No jobs found</li>
        {% endfor %}
    </ul>
    <p>Всего {{ jobs|length }} вакансий</p>
    <a href="{% url 'about' %}">about</a>
</body>
</html>
